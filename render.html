<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRL Flyer Renderer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/flyer.css">   <!-- SHARED flyer output styles -->
<style>
  body{margin:0;background:#fff;}
  #fl_stage{position:absolute;left:0;top:0;}
  .fl-hidden-inputs{position:absolute;left:-99999px;top:-99999px;visibility:hidden;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="assets/flyer-render.js"></script>   <!-- SHARED render engine + globals -->
</head>
<body>
<div class="fl-hidden-inputs flyer-scope">
  <input type="text" id="fl_in_eyebrow"><input type="text" id="fl_in_headline">
  <textarea id="fl_in_lead"></textarea>
  <input type="text" id="fl_in_t0_h"><textarea id="fl_in_t0_p"></textarea>
  <input type="text" id="fl_in_t1_h"><textarea id="fl_in_t1_p"></textarea>
  <input type="text" id="fl_in_t2_h"><textarea id="fl_in_t2_p"></textarea>
  <input type="text" id="fl_in_t3_h"><textarea id="fl_in_t3_p"></textarea>
  <input type="text" id="fl_in_t4_h"><textarea id="fl_in_t4_p"></textarea>
  <input type="text" id="fl_in_t5_h"><textarea id="fl_in_t5_p"></textarea>
  <input type="text" id="fl_in_ftName"><input type="text" id="fl_in_ftAddr1">
  <input type="text" id="fl_in_ftAddr2"><input type="text" id="fl_in_ftPhone">
  <input type="text" id="fl_in_ftHoursLabel"><input type="text" id="fl_in_ftHours1">
  <input type="text" id="fl_in_ftHours2"><input type="text" id="fl_in_footPowered">
  <input type="text" id="fl_in_footCode">
</div>

<div id="fl_stage" class="flyer-scope">
  <div class="flyer" id="fl_in_flyer">
    <div class="fl-header">
      <div class="bg" id="fl_bg"></div>
      <div class="htexture"></div>
      <div class="scrim"></div>
      <div class="hcontent">
        <span class="eyebrow-pill" id="fl_eyebrow"></span>
        <div class="fl-head" id="fl_head"></div>
      </div>
    </div>
    <div class="fl-body">
      <div id="fl_bodyZone"></div>
    </div>
    <div class="fl-addr" id="fl_addr">
      <div class="fl-addr__col">
        <div class="fl-addr__name" id="fl_ftName"></div>
        <div class="fl-addr__line" id="fl_ftAddr1"></div>
        <div class="fl-addr__line" id="fl_ftAddr2"></div>
        <div class="fl-addr__line" id="fl_ftPhone"></div>
      </div>
      <div class="fl-addr__col">
        <div class="fl-addr__name" id="fl_ftHoursLabel"></div>
        <div class="fl-addr__line" id="fl_ftHours1"></div>
        <div class="fl-addr__line" id="fl_ftHours2"></div>
      </div>
      <div class="fl-addr__logo" id="fl_ftLogo"></div>
    </div>
    <div class="fl-foot">
      <span class="powered" id="fl_footPowered"></span>
      <span class="code" id="fl_footCode"></span>
    </div>
  </div>
</div>

<script>
// ============================================================================
// render.html DRIVER — reconstructs a flyer from its manifest in a given brand.
// The render ENGINE (fl_renderBody/fl_draw/fl_buildFlyerPDF + globals) lives in
// the SHARED assets/flyer-render.js. This file only maps manifest+brand -> inputs
// and returns the PDF. Do NOT copy render functions back in here.
// ============================================================================
const DRL_API = "https://n8n-admin.willclower.com/webhook/drl";
const FL_IMG_BYTES = DRL_API + "/image?id=";

function fl_setInput(id, v){ const el=fl_$(id); if(el) el.value = (v==null?"":String(v)); }

async function fl_toDataUrl(refOrData){
  if(!refOrData) return null;
  if(/^data:/.test(refOrData)) return refOrData;
  const res = await fetch(FL_IMG_BYTES + encodeURIComponent(refOrData));
  if(!res.ok) throw new Error("image fetch failed: "+refOrData);
  const blob = await res.blob();
  return await new Promise((resolve,reject)=>{
    const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(blob);
  });
}

async function renderFlyerFromManifest(manifest, brand){
  const m = manifest || {};
  fl_template = m.template || "checklist";

  fl_setInput("fl_in_eyebrow",  m.eyebrow);
  fl_setInput("fl_in_headline", m.headline);
  fl_setInput("fl_in_lead",     m.lead);
  const tiles = Array.isArray(m.tiles) ? m.tiles : [];
  for(let i=0;i<6;i++){
    fl_setInput(`fl_in_t${i}_h`, tiles[i] ? tiles[i].h : "");
    fl_setInput(`fl_in_t${i}_p`, tiles[i] ? tiles[i].p : "");
  }

  const b = brand || {};
  const flyer = fl_$("fl_in_flyer");
  if(b.primary)   flyer.style.setProperty("--brand-primary", b.primary);
  if(b.secondary) flyer.style.setProperty("--brand-secondary", b.secondary);

  const mf = m.footer || {};
  const bf = b.footer || {};
  fl_setInput("fl_in_ftName",       bf.name        != null ? bf.name        : mf.name);
  fl_setInput("fl_in_ftAddr1",      bf.addr1       != null ? bf.addr1       : mf.addr1);
  fl_setInput("fl_in_ftAddr2",      bf.addr2       != null ? bf.addr2       : mf.addr2);
  fl_setInput("fl_in_ftPhone",      bf.phone       != null ? bf.phone       : mf.phone);
  fl_setInput("fl_in_ftHoursLabel", bf.hours_label != null ? bf.hours_label : mf.hours_label);
  fl_setInput("fl_in_ftHours1",     bf.hours1      != null ? bf.hours1      : mf.hours1);
  fl_setInput("fl_in_footCode",     b.footCode || "");

  fl_logoData = b.logo || null;

  fl_bannerY = (m.focus_y==null || isNaN(+m.focus_y)) ? 50 : Math.max(0,Math.min(100,+m.focus_y));
  const bannerData = await fl_toDataUrl(m.banner_ref || m.banner);
  const bg = fl_$("fl_bg");
  if(bg && bannerData){ bg.style.backgroundImage = `url('${bannerData}')`; bg.style.backgroundPosition = `50% ${fl_bannerY}%`; }

  fl_subjectData = (m.subject_ref || m.subject) ? await fl_toDataUrl(m.subject_ref || m.subject) : null;

  fl_draw();
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  return await fl_buildFlyerPDF();
}

window.addEventListener("message", async (ev)=>{
  const d = ev.data || {};
  if(d.type !== "render") return;
  try{
    const out = await renderFlyerFromManifest(d.manifest, d.brand);
    (ev.source||window.parent).postMessage({ type:"render-result", reqId:d.reqId, ok:true,
      pdfB64: out.pdfB64, thumbB64: out.thumbB64 }, "*");
  }catch(e){
    (ev.source||window.parent).postMessage({ type:"render-result", reqId:d.reqId, ok:false,
      error: (e&&e.message)?e.message:String(e) }, "*");
  }
});

window.addEventListener("load", ()=>{ try{ (window.parent||window).postMessage({type:"render-ready"},"*"); }catch(e){} });
window.renderFlyerFromManifest = renderFlyerFromManifest;
</script>
</body>
</html>
