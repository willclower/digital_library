<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wellness Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Neutral MedWell defaults. Overridden at runtime from brand_config. */
    --navy:#1b2a4a; --blue:#2f6fb0; --orange:#e08a1e;
    --bg:#f7f6f2; --card:#ffffff; --ink:#2a2f38; --muted:#6b7480;
    --line:#e6e3da; --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;
  }
  .topbar{
    display:flex;align-items:center;gap:12px;
    padding:18px 32px;border-bottom:1px solid var(--line);background:#fbfaf7;
  }
  .topbar img{height:26px;width:auto;display:none}
  .brand{font-weight:600;color:var(--blue);font-size:15px;letter-spacing:.01em}
  .topbar .sub{font-size:12px;color:var(--muted);margin-left:auto}

  .wrap{max-width:960px;margin:0 auto;padding:56px 32px 72px}
  .kicker{
    display:inline-block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--blue);font-weight:600;border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;margin-bottom:22px;background:#fff;
  }
  h1{
    font-family:'Fraunces',Georgia,serif;font-weight:400;color:var(--navy);
    font-size:46px;line-height:1.05;margin:0 0 14px;letter-spacing:-.01em;
  }
  h1 .accent{display:block;font-style:italic;font-weight:500;color:var(--blue)}
  .lede{color:var(--muted);font-size:15.5px;max-width:52ch;margin:0 0 44px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
  .tile{
    display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:28px 26px;text-decoration:none;color:inherit;
    transition:transform .15s,box-shadow .15s,border-color .15s;
    min-height:190px;
  }
  .tile:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(27,42,74,.10);border-color:var(--blue)}
  .tile .tnum{
    font-family:'Fraunces',serif;font-size:13px;color:var(--muted);
    letter-spacing:.05em;margin-bottom:auto
  }
  .tile h2{
    font-family:'Fraunces',serif;font-weight:600;color:var(--navy);
    font-size:24px;margin:0 0 8px;letter-spacing:-.01em;line-height:1.15
  }
  .tile p{color:var(--muted);font-size:14px;margin:0 0 18px}
  .tile .go{
    align-self:flex-start;font-weight:600;font-size:13.5px;color:var(--blue);
    border-top:2px solid var(--orange);padding-top:10px
  }
  .tile.disabled{opacity:.5;pointer-events:none}
  .tile.disabled .go{color:var(--muted);border-top-color:var(--line)}

  .status{margin-top:40px;font-size:12.5px;color:var(--muted)}
  @media(max-width:520px){ h1{font-size:34px} .wrap{padding:36px 20px 56px} }
</style>
</head>
<body>
<div class="topbar">
  <img id="logo" alt="">
  <span class="brand" id="brandname">Wellness Tools</span>
  <span class="sub" id="tenant"></span>
</div>

<div class="wrap">
  <span class="kicker">Wellness tools</span>
  <h1>Your wellness toolkit,<span class="accent">in one place.</span></h1>
  <p class="lede">Open a tool to get started. Everything you build stays with your organization.</p>

  <div class="tiles" id="tiles">
    <p class="status" id="loading">Loading tools…</p>
  </div>

  <p class="status" id="err" style="display:none"></p>
</div>

<script>
// Points at the hub/config webhook we already built and tested.
// Change to the prod URL when the workflow is set Active.
const CONFIG_URL = "https://n8n-admin.willclower.com/webhook/hub-config";

const COPY = {
  translation: "Upload a document, pick a language and style, get it back translated with the layout intact. Reused instantly if it's already been done.",
  vwl: "Browse ready-to-run workplace wellness screens. Search by subject, preview, and download.",
  reports: "See how your organization is using the tools — downloads, QR scans, translations, and trends over time."
};

function applyBrand(bc){
  if(!bc) return;
  const c = bc.colors || {};
  const root = document.documentElement.style;
  if(c.navy)   root.setProperty('--navy',   c.navy);
  if(c.blue)   root.setProperty('--blue',   c.blue);
  if(c.orange) root.setProperty('--orange', c.orange);
  if(bc.typeface){
    document.querySelectorAll('h1,h2,.tnum,.stat .v').forEach(e=>{
      e.style.fontFamily = `'${bc.typeface}', Georgia, serif`;
    });
  }
  if(bc.logo){
    const l = document.getElementById('logo');
    l.src = bc.logo; l.style.display = 'block';
  }
}

function tileEl(t, i){
  const usable = t.enabled && t.url && !/^</.test(t.url); // guard placeholder "<...>" urls
  const el = document.createElement(usable ? 'a' : 'div');
  el.className = 'tile' + (usable ? '' : ' disabled');
  const internal = t.key === 'reports'; // internal pages open in place; tools open in a new tab
  if(usable){ el.href = t.url; if(!internal){ el.target = '_blank'; el.rel = 'noopener'; } }
  el.innerHTML = `
    <div class="tnum">0${i+1}</div>
    <h2>${t.label}</h2>
    <p>${COPY[t.key] || ''}</p>
    <span class="go">${usable ? 'Open →' : 'Coming soon'}</span>`;
  return el;
}

async function boot(){
  try{
    const res = await fetch(CONFIG_URL, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'
    });
    let data = await res.json();
    if(Array.isArray(data)) data = data[0]; // n8n executeQuery can wrap in an array

    applyBrand(data.brand_config);
    document.getElementById('brandname').textContent =
      (data.brand_config && data.brand_config.name) || data.name || 'Wellness Tools';
    document.getElementById('tenant').textContent = data.name || '';
    document.title = (data.name ? data.name + ' — ' : '') + 'Wellness Tools';

    const wrap = document.getElementById('tiles');
    wrap.innerHTML = '';
    const tiles = data.tiles || [];
    tiles.forEach((t,i)=> wrap.appendChild(tileEl(t,i)));
    // Reports is an internal page, not an external tool URL — always shown.
    wrap.appendChild(tileEl(
      { key:'reports', label:'Reports', url:'reports.html', enabled:true }, tiles.length
    ));
  }catch(e){
    document.getElementById('loading').style.display='none';
    const err = document.getElementById('err');
    err.style.display='block';
    err.textContent = 'Could not load tools. Check that the hub-config workflow is running, then refresh.';
  }
}
boot();
</script>
</body>
</html>
