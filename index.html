<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Wellness Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!-- styles.css carries the .vwl-* SCREEN render rules (shared with screen.html).
     The library INTERFACE chrome is inlined below so this page is self-contained
     and never depends on the asset path resolving. -->
<link rel="stylesheet" href="assets/styles.css">
<style>
  :root{
    --brand-blue:#236192; --brand-navy:#002855; --brand-orange:#ED8B00; --brand-spruce:#126e46;
    --accent:var(--brand-orange); --accent-text:#B5811F;
    --library:#17402F; --library-hover:#1F5B41; --chip-lib-bg:#E7EFEA;
    --ink:#0E2A44; --ink-deep:#0C2135;
    --paper:#EFEBE2; --paper-lt:#F6F3ED; --panel:#FFFDF9;
    --border:#E0D9CB; --border-lt:#EFE9DE; --border-st:#C9C2B3;
    --muted:#5F6B77; --muted-2:#6B7885; --subtle:#8A9199; --faint:#A9A192;
    --cream:#F1EADC; --chip-bg:#F1ECE1;
    --r-input:5px; --r-card:8px; --r-pill:20px;
    --shadow-asset:0 18px 40px -26px rgba(14,42,68,0.5);
    --font-ui:"Instrument Sans",system-ui,-apple-system,sans-serif;
    --font-voice:"Newsreader",Georgia,serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{font-family:var(--font-ui);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;}

  .topbar{display:flex;align-items:center;gap:12px;padding:16px 34px;background:#fbfaf7;border-bottom:1px solid var(--border);}
  .topbar img{height:26px;display:none;}
  .topbar .brand{font-weight:600;color:var(--brand-blue);font-size:15px;}
  .topbar .back{margin-left:auto;font-size:12.5px;color:var(--muted);text-decoration:none;}
  .topbar .back:hover{color:var(--accent-text);}

  .shell{display:grid;grid-template-columns:236px minmax(0,1fr);align-items:start;}

  .rail{padding:30px 22px 60px;border-right:1px solid var(--border);position:sticky;top:0;}
  .rail .refine{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--subtle);margin-bottom:14px;}
  .rail .searchbar{width:100%;height:38px;border:1px solid var(--border);border-radius:var(--r-input);padding:0 12px;font:inherit;font-size:13px;background:var(--panel);margin-bottom:20px;}
  .rail .searchbar:focus{outline:none;border-color:var(--library);box-shadow:0 0 0 3px var(--chip-lib-bg);}
  .fgroup{margin-bottom:22px;}
  .fgroup .flabel{font-size:12px;font-weight:600;margin-bottom:9px;}
  .subj{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--muted);}
  .subj label{display:flex;align-items:center;gap:8px;cursor:pointer;}
  .subj input{accent-color:var(--library);}
  .subj .cnt{margin-left:auto;color:var(--faint);}
  .pills{display:flex;flex-wrap:wrap;gap:6px;}
  .pill{font-size:11.5px;padding:5px 11px;border-radius:var(--r-pill);border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;user-select:none;}
  .pill[data-on="1"]{border-color:var(--library);background:var(--library);color:var(--cream);}
  .clear{display:inline-block;margin-top:6px;font-size:12px;color:var(--accent-text);background:none;border:0;padding:0;cursor:pointer;}

  .content{padding:30px 34px 70px;}
  .chead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:8px;flex-wrap:wrap;}
  .chead .titleblock{min-width:0;}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-text);margin-bottom:12px;}
  .eyebrow>span{width:22px;height:1px;background:var(--accent);}
  h1{font-family:var(--font-voice);font-weight:300;font-size:42px;line-height:1.05;margin:0 0 8px;letter-spacing:-.015em;}
  h1 em{font-style:italic;color:#1D5B7E;}
  .sub{margin:0;font-size:13.5px;color:var(--muted);}

  .active{display:flex;gap:8px;margin:22px 0 20px;flex-wrap:wrap;align-items:center;min-height:24px;}
  .active .lbl{font-size:11.5px;color:var(--subtle);}
  .achip{font-size:11.5px;padding:5px 10px;border-radius:var(--r-pill);background:var(--chip-lib-bg);color:var(--library);display:inline-flex;gap:7px;align-items:center;cursor:pointer;border:0;font-family:inherit;}
  .achip .x{opacity:.6;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:20px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column;transition:border-color .13s,box-shadow .13s;}
  .card:hover{border-color:var(--ink);box-shadow:var(--shadow-asset);}
  .card .thumb{position:relative;aspect-ratio:16/9;background:#111;overflow:hidden;}
  .card .thumb .vwl-screen{border-radius:0;height:100%;}
  .card .doc-thumb{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#f4f1ea,#e6e0d4);}
  .card .doc-img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;}
  .card .doc-icon{font-family:var(--font-voice);font-weight:600;font-size:26px;letter-spacing:2px;color:var(--ink);border:2px solid var(--ink);border-radius:6px;padding:14px 20px;opacity:.72;}
  .card .doc-desc{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .fmt-badge{position:absolute;top:12px;right:12px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;background:rgba(255,253,249,.9);color:var(--library);padding:4px 8px;border-radius:3px;}
  .card .meta{padding:16px 18px 18px;}
  .card .mrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .card .mt{font-family:var(--font-voice);font-weight:400;font-size:17.5px;margin:0 0 8px;line-height:1.2;}
  .card .stat{font-size:11px;color:var(--faint);white-space:nowrap;padding-top:3px;}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}
  .tag{font-size:10.5px;padding:3px 8px;border-radius:var(--r-pill);background:var(--chip-bg);color:var(--muted-2);}
  .rowbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .btn{font:inherit;font-size:12.5px;padding:9px;border-radius:var(--r-input);border:1px solid var(--border-st);background:var(--panel);color:var(--ink);cursor:pointer;text-align:center;text-decoration:none;}
  .btn:hover{border-color:var(--ink);background:var(--paper-lt);}
  .btn-primary{background:var(--library);color:var(--cream);border-color:var(--library);font-weight:600;}
  .btn-primary:hover{background:var(--library-hover);border-color:var(--library-hover);}

  .count{font-size:12px;color:var(--subtle);margin:0 0 12px;}
  .empty{grid-column:1/-1;background:var(--paper-lt);border:1px dashed var(--border-st);border-radius:var(--r-card);min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:13.5px;text-align:center;padding:30px;}

  @media(max-width:820px){
    .shell{grid-template-columns:1fr;}
    .rail{position:static;border-right:0;border-bottom:1px solid var(--border);}
    h1{font-size:34px;}
  }
</style>
</head>
<body>
<div class="topbar">
  <img id="logo" alt="">
  <span class="brand" id="brandname">Wellness Tools</span>
  <a class="back" href="../wellness_tools/index.html">&larr; Back to tools</a>
</div>

<div class="shell">
  <aside class="rail">
    <div class="refine">Refine</div>
    <input id="q" class="searchbar" type="text" placeholder="Search screens — try 'stress', 'heat', 'sleep'…" oninput="render()">

    <div class="fgroup">
      <div class="flabel">Subject</div>
      <div class="subj" id="f-subject"></div>
    </div>
    <div class="fgroup">
      <div class="flabel">Format</div>
      <div class="pills" id="f-format"></div>
    </div>
    <div class="fgroup">
      <div class="flabel">Setting</div>
      <div class="pills" id="f-setting"></div>
    </div>
    <div class="fgroup">
      <div class="flabel">Tone</div>
      <div class="pills" id="f-tone"></div>
    </div>
    <div class="fgroup">
      <div class="flabel">Month</div>
      <div class="pills" id="f-month"></div>
    </div>

    <button class="clear" id="clearAll" onclick="clearAll()">Clear all filters</button>
  </aside>

  <div class="content">
    <div class="chead">
      <div class="titleblock">
        <div class="eyebrow"><span></span>Visual library</div>
        <h1>Content your crews <em>actually stop for.</em></h1>
        <p class="sub" id="libsub">Workplace-screen content &middot; white-label ready</p>
      </div>
    </div>

    <div class="active" id="active"></div>
    <p class="count" id="count">Loading library&hellip;</p>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script src="assets/overlay.js"></script>
<script>
let DATA = { screens: [] };
const sel = { subject:new Set(), month:new Set(), setting:new Set(), tone:new Set(), format:new Set() };

// ---- Screen data API (DRL) ----
const DRL_API   = "https://n8n-admin.willclower.com/webhook/drl";
function resolveImage(s){
  if (s.background_ref) return s.background_ref;      // "gradient:night" etc.
  if (!s.image_url) return null;
  // image_url is "/api/image/{id}" or "/api/file/{id}"; live endpoints take
  // the id as a query param: DRL_API + "/image?id={id}".
  const m = /\/api\/(image|file)\/(.+)$/.exec(s.image_url);
  const kind = m ? m[1] : "image";
  const id = m ? m[2] : s.image_url.split("/").pop();
  return DRL_API + "/" + kind + "?id=" + encodeURIComponent(id);
}
function resolveThumb(marker){
  // marker is "/api/thumb/{id}"; rewrite to the live /thumb?id= endpoint.
  const m = /\/api\/thumb\/(.+)$/.exec(marker);
  const id = m ? m[1] : marker.split("/").pop();
  return DRL_API + "/thumb?id=" + encodeURIComponent(id);
}
// API returns tags as arrays + flat columns; this index expects s.tags[g] as a string.
// Normalize each API row into the shape this page already knows.
function normalize(row){
  const first = a => Array.isArray(a) ? a[0] : a;
  const at = row.asset_type || "screen";
  const isDoc = at !== "screen";
  return {
    id: row.id, title: row.title, subtitle: row.subtitle,
    eyebrow: row.eyebrow, cta: row.cta,
    treatment: row.treatment, accent: row.accent, format: row.format,
    qrUrl: row.qr_url,
    assetType: at, isDoc,
    description: row.description, issueDate: row.issue_date,
    thumbUrl: row.thumb_url ? resolveThumb(row.thumb_url) : null,
    // For docs the "background" is the /file endpoint (preview + download both use it).
    background: isDoc ? resolveImage(row) : (resolveImage(row) || "gradient:night"),
    tags: {
      subject: first(row.subject), month: first(row.month),
      setting: first(row.setting), aspect: first(row.aspect),
      tone: first(row.tone), format: row.format
    }
  };
}
     
// --- Download tracking hook (host per Alex; unchanged) ---
const BEACON = "https://n8n.mymedwellness.com/webhook/vwl-download";
function trackDownload(screen){
  try{
    navigator.sendBeacon(BEACON, JSON.stringify({
      id: screen.id, title: screen.title, tags: screen.tags,
      ts: new Date().toISOString(), client: DATA.client || "demo"
    }));
  }catch(e){ /* non-blocking */ }
}

const LABELS = { "mental-health":"Mental health", "heat":"Heat & hydration" };
const label = v => LABELS[v] || (v.charAt(0).toUpperCase()+v.slice(1));
function countFor(g, v){ return DATA.screens.filter(s=>s.tags[g]===v).length; }

function buildFilters(){
  const vocab = DATA.library.tagVocabulary;
  const present = g => [...new Set(DATA.screens.map(s => s.tags[g]).filter(Boolean))];
  const ordered = g => { const order=vocab[g]||[]; return present(g).sort((a,b)=>order.indexOf(a)-order.indexOf(b)); };

  document.getElementById("f-subject").innerHTML = ordered("subject").map(v=>`
    <label><input type="checkbox" data-g="subject" data-v="${v}" onchange="togCheck(this)">${label(v)}<span class="cnt">${countFor("subject",v)}</span></label>
  `).join("");

  for(const g of ["format","setting","tone","month"]){
    document.getElementById("f-"+g).innerHTML = ordered(g).map(v=>
      `<span class="pill" data-g="${g}" data-v="${v}" data-on="0" onclick="togPill(this)">${label(v)}</span>`
    ).join("");
  }
}

function togCheck(el){ const g=el.dataset.g, v=el.dataset.v; el.checked ? sel[g].add(v) : sel[g].delete(v); render(); }
function togPill(el){ const g=el.dataset.g, v=el.dataset.v, on=el.dataset.on==="1"; el.dataset.on = on?"0":"1"; on ? sel[g].delete(v) : sel[g].add(v); render(); }
function clearAll(){
  for(const g in sel) sel[g].clear();
  document.getElementById("q").value="";
  document.querySelectorAll('.subj input').forEach(c=>c.checked=false);
  document.querySelectorAll('.pill').forEach(p=>p.dataset.on="0");
  render();
}
function removeFilter(g,v){
  sel[g].delete(v);
  const cb=document.querySelector(`.subj input[data-g="${g}"][data-v="${v}"]`); if(cb) cb.checked=false;
  const pl=document.querySelector(`.pill[data-g="${g}"][data-v="${v}"]`); if(pl) pl.dataset.on="0";
  render();
}

function matches(s){
  for(const g in sel){ if(sel[g].size && !sel[g].has(s.tags[g])) return false; }
  const q = document.getElementById("q").value.trim().toLowerCase();
  if(q){
    const hay = [s.title, s.subtitle, s.eyebrow, ...Object.values(s.tags)].join(" ").toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}

function renderActive(){
  const el=document.getElementById("active");
  const chips=[];
  for(const g in sel){ for(const v of sel[g]){ chips.push(
    `<button class="achip" onclick="removeFilter('${g}','${v}')">${label(v)} <span class="x">&#10005;</span></button>`
  ); } }
  el.innerHTML = chips.length ? `<span class="lbl">Active:</span>${chips.join("")}` : "";
}

function render(){
  const out = DATA.screens.filter(matches);
  const active = Object.values(sel).some(x=>x.size) || document.getElementById("q").value.trim();
  document.getElementById("count").textContent =
    active ? `Showing ${out.length} of ${DATA.screens.length} screens` : `${DATA.screens.length} screens`;
  renderActive();

  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  if(!out.length){
    grid.innerHTML = `<div class="empty"><div>No screens match those filters.</div><button class="btn" onclick="clearAll()">Show all</button></div>`;
    return;
  }
  out.forEach(s=>{
    const card = document.createElement("article");
    card.className = "card";
    const badges = ["subject","setting","month"].map(k=>s.tags[k]).filter(Boolean)
      .map(v=>`<span class="tag">${label(v)}</span>`).join("");

    if(s.isDoc){
      // Document card (flyer / newsletter): no screen overlay; Preview + Download
      // both point at the /file endpoint (s.background).
      const kind = s.assetType==='newsletter' ? 'Newsletter' : 'Flyer';
      const fileUrl = s.background || '#';
      const thumbInner = s.thumbUrl
        ? `<img class="doc-img" src="${s.thumbUrl}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='<div class=&quot;doc-icon&quot;>PDF</div>'">`
        : `<div class="doc-icon">PDF</div>`;
      card.innerHTML = `
        <div class="thumb doc-thumb">
          ${thumbInner}
          <span class="fmt-badge">${kind}</span>
        </div>
        <div class="meta">
          <div class="mrow">
            <h3 class="mt">${s.title}</h3>
          </div>
          ${s.description?`<p class="doc-desc">${s.description}</p>`:''}
          <div class="tags">${badges}</div>
          <div class="rowbtns">
            <a class="btn" href="${fileUrl}" target="_blank" rel="noopener">Preview</a>
            <a class="btn btn-primary" href="${fileUrl}" download onclick="trackDownload(${JSON.stringify(s).replace(/"/g,'&quot;')})">Download</a>
          </div>
        </div>`;
      grid.appendChild(card);
      return;
    }

    const fmt = (s.tags.aspect || (s.tags.format==='video'?'Video':'16:9'));
    const stat = s.tags.format==='video' ? 'Video loop' : '';
    card.innerHTML = `
      <div class="thumb">
        <div class="vwl-screen" data-thumb></div>
        <span class="fmt-badge">${fmt}</span>
      </div>
      <div class="meta">
        <div class="mrow">
          <h3 class="mt">${s.title}</h3>
          ${stat?`<span class="stat">${stat}</span>`:''}
        </div>
        <div class="tags">${badges}</div>
        <div class="rowbtns">
          <a class="btn" href="screen.html?id=${encodeURIComponent(s.id)}" target="_blank" rel="noopener">Preview</a>
          <a class="btn btn-primary" href="${s.background.startsWith('gradient')?'#':s.background}" download onclick="trackDownload(${JSON.stringify(s).replace(/"/g,'&quot;')})">Download</a>
        </div>
      </div>`;
    grid.appendChild(card);
    renderScreen(card.querySelector("[data-thumb]"), s, { scale:0.42, chrome:true, qr:false });
  });
}

function applyBrand(bc){
  if(!bc) return;
  const c=bc.colors||{}, r=document.documentElement.style;
  if(c.blue)   r.setProperty('--brand-blue',c.blue);
  if(c.navy){  r.setProperty('--brand-navy',c.navy); r.setProperty('--ink',c.navy); }
  if(c.orange){r.setProperty('--brand-orange',c.orange); r.setProperty('--accent',c.orange); }
  if(c.spruce){r.setProperty('--brand-spruce',c.spruce); }
  if(bc.logo){ const l=document.getElementById('logo'); l.src=bc.logo; l.style.display='block'; }
}
const CONFIG_URL = "https://n8n-admin.willclower.com/webhook/hub-config";
async function loadBranding(){
  try{
    const res=await fetch(CONFIG_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
    let cfg=await res.json(); if(Array.isArray(cfg)) cfg=cfg[0];
    applyBrand(cfg.brand_config);
    const nm=(cfg.brand_config&&cfg.brand_config.name)||cfg.name;
    if(nm) document.getElementById('brandname').textContent=nm;
    if(cfg.vwl_client) DATA.client=cfg.vwl_client;
  }catch(e){ /* branding best-effort */ }
}

async function boot(){
  await loadBranding();
  try{
    const res = await fetch(DRL_API + "/library");
    const lib = await res.json();
    lib.screens = (lib.screens || []).map(normalize);
    // rebuild the tagVocabulary this page expects, from what's present
    lib.library = lib.library || {};
    lib.library.tagVocabulary = {
      subject:["stress","sleep","heat","mental-health","movement","nutrition","hydration","prevention","burnout","heart-health","connection"],
      month:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
      setting:["floor","breakroom","office","any"],
      aspect:["16:9","9:16"], tone:["calm","action"], format:["still","video"]
    };
    DATA = Object.assign(lib, { client: DATA.client });
  }catch(e){
    document.getElementById("count").textContent = "Could not load library from API.";
    return;
  }
  document.getElementById("libsub").textContent =
    `Workplace wellness resources \u00B7 ${DATA.screens.length} items \u00B7 white-label ready`;
  buildFilters();
  render();
}
boot();
</script>
</body>
</html>
