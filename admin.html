<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRL · Add a Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  :root{
    --ink:#0E2A44; --paper:#EFEBE2; --panel:#FFFDF9; --border:#E0D9CB; --border-st:#C9C2B3;
    --muted:#5F6B77; --subtle:#8A9199; --library:#17402F; --library-hover:#1F5B41;
    --chip-lib-bg:#E7EFEA; --cream:#F1EADC; --accent-text:#B5811F; --danger:#b23b3b;
    --font-ui:"Instrument Sans",system-ui,sans-serif; --font-voice:"Newsreader",Georgia,serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{font-family:var(--font-ui);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;}
  .topbar{display:flex;align-items:center;gap:12px;padding:16px 34px;background:#fbfaf7;border-bottom:1px solid var(--border);}
  .topbar .brand{font-weight:600;color:var(--library);font-size:15px;}
  .topbar .back{margin-left:auto;font-size:12.5px;color:var(--muted);text-decoration:none;}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:34px;padding:30px 34px 70px;align-items:start;max-width:1300px;}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-text);margin-bottom:10px;}
  .eyebrow>span{width:22px;height:1px;background:var(--accent-text);}
  h1{font-family:var(--font-voice);font-weight:300;font-size:32px;line-height:1.05;margin:0 0 6px;}
  .sub{margin:0 0 22px;font-size:13px;color:var(--muted);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;}
  .field .hint{font-weight:400;color:var(--subtle);font-size:11px;margin-left:6px;}
  input[type=text],textarea,select{width:100%;font:inherit;font-size:13px;background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:9px 11px;color:var(--ink);}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--library);box-shadow:0 0 0 3px var(--chip-lib-bg);}
  textarea{resize:vertical;min-height:52px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .pills{display:flex;flex-wrap:wrap;gap:6px;}
  .pill{font-size:11.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;user-select:none;}
  .pill[data-on="1"]{border-color:var(--library);background:var(--library);color:var(--cream);}
  .drop{border:1px dashed var(--border-st);border-radius:8px;background:var(--panel);padding:18px;text-align:center;font-size:12.5px;color:var(--muted);cursor:pointer;}
  .drop.hasfile{border-style:solid;border-color:var(--library);color:var(--library);}
  .swatch{display:inline-block;width:22px;height:22px;border-radius:5px;border:1px solid var(--border-st);vertical-align:middle;margin-left:8px;}
  .actions{display:flex;gap:10px;align-items:center;margin-top:8px;}
  .btn{font:inherit;font-size:13px;padding:10px 18px;border-radius:6px;border:1px solid var(--border-st);background:var(--panel);color:var(--ink);cursor:pointer;}
  .btn-primary{background:var(--library);color:var(--cream);border-color:var(--library);font-weight:600;}
  .btn-primary:hover{background:var(--library-hover);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .msg{font-size:12.5px;margin-left:4px;}
  .msg.ok{color:var(--library);}
  .msg.err{color:var(--danger);}
  .previewwrap{position:sticky;top:24px;}
  .plabel{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle);margin-bottom:10px;}
  .frame{width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#111;box-shadow:0 18px 40px -26px rgba(14,42,68,.5);}
  .frame .vwl-screen{border-radius:0;height:100%;}
  .dims{font-size:11.5px;color:var(--muted);margin-top:10px;}
  .dims .warn{color:var(--danger);}
  @media(max-width:900px){ .wrap{grid-template-columns:1fr;} .previewwrap{position:static;} }
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">Digital Resource Library</span>
  <a class="back" href="index.html">&larr; Back to library</a>
</div>

<div class="wrap">
  <!-- ================= FORM ================= -->
  <div>
    <div class="eyebrow"><span></span>Admin</div>
    <h1>Add a resource</h1>
    <p class="sub">Pick the type, drop in the finished asset. The system drafts the copy and tags — you review, edit, and publish.</p>

    <!-- ===== Asset type ===== -->
    <div class="field">
      <label>Asset type</label>
      <div class="pills" id="assetTypePills">
        <span class="pill" data-t="screen"     data-on="1" onclick="setAssetType('screen')">Screen</span>
        <span class="pill" data-t="flyer"      data-on="0" onclick="setAssetType('flyer')">Flyer</span>
        <span class="pill" data-t="newsletter" data-on="0" onclick="setAssetType('newsletter')">Newsletter</span>
      </div>
    </div>

    <!-- ===== Upload + AI draft ===== -->
    <div class="field">
      <label>Upload asset <span class="hint" id="uploadHint">16:9 image (PNG/JPEG)</span></label>
      <label class="drop" id="assetDrop" for="assetFile">Click to choose a file, or drag one here</label>
      <input type="file" id="assetFile" style="display:none" onchange="onAsset(event)">
    </div>
    <div class="actions" style="margin:-6px 0 18px;">
      <button class="btn" id="draftBtn" onclick="runDraft()" disabled>Draft with AI</button>
      <span class="msg" id="draftMsg"></span>
    </div>

    <div class="field">
      <label id="titleLabel">Headline <span class="hint">the big line</span></label>
      <input type="text" id="title" oninput="onTitle()" placeholder="Know your numbers.">
    </div>
    <div class="field screen-only">
      <label>Subtitle</label>
      <textarea id="subtitle" oninput="draw()" placeholder="Blood pressure and cholesterol don't announce themselves…"></textarea>
    </div>
    <div class="row2 screen-only">
      <div class="field">
        <label>Eyebrow <span class="hint">small line above</span></label>
        <input type="text" id="eyebrow" oninput="draw()" placeholder="American Heart Month">
      </div>
      <div class="field">
        <label>CTA</label>
        <input type="text" id="cta" oninput="draw()" placeholder="Get your numbers checked — ask your clinic">
      </div>
    </div>

    <!-- ===== Doc-only fields (flyer / newsletter) ===== -->
    <div class="doc-only" style="display:none">
      <div class="field">
        <label>Description <span class="hint">short summary</span></label>
        <textarea id="description" placeholder="What this covers…"></textarea>
      </div>
      <div class="field">
        <label>Issue date <span class="hint">YYYY-MM-DD (optional)</span></label>
        <input type="text" id="issue_date" placeholder="2026-02-01">
      </div>
    </div>

    <div class="row3 screen-only">
      <div class="field">
        <label>Treatment</label>
        <select id="treatment" onchange="draw()">
          <option value="left-scrim">left-scrim (subject right)</option>
          <option value="right-scrim">right-scrim (subject left)</option>
          <option value="bottom-band">bottom-band</option>
        </select>
      </div>
      <div class="field">
        <label>Accent <span class="hint" id="accentHint"></span></label>
        <input type="text" id="accent" value="#d9b98f" oninput="draw()" placeholder="#d9b98f">
      </div>
      <div class="field">
        <label>Format</label>
        <select id="format" onchange="draw()">
          <option value="still">still</option>
          <option value="video">video</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Subject <span class="hint">choose one or more</span></label>
      <div class="pills" id="t-subject"></div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Month</label>
        <div class="pills" id="t-month"></div>
      </div>
      <div class="field">
        <label>Setting</label>
        <div class="pills" id="t-setting"></div>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Tone</label>
        <div class="pills" id="t-tone"></div>
      </div>
      <div class="field screen-only">
        <label>Aspect</label>
        <div class="pills" id="t-aspect"></div>
      </div>
    </div>

    <div class="field">
      <label id="idLabel">Screen ID <span class="hint">auto from headline; edit if needed</span></label>
      <input type="text" id="id" placeholder="heart-bp-check-01">
    </div>
    <div class="field screen-only">
      <label>QR URL <span class="hint">auto from ID</span></label>
      <input type="text" id="qr_url" placeholder="https://go.mymedwellness.com/s/heart-bp-check-01">
    </div>

    <div class="actions">
      <button class="btn-primary" id="save" onclick="save()">Publish screen</button>
      <button class="btn" onclick="resetForm()">Clear</button>
      <span class="msg" id="msg"></span>
    </div>
  </div>

  <!-- ================= PREVIEW ================= -->
  <div class="previewwrap">
    <div class="plabel">Live preview</div>
    <div class="frame"><div id="preview" class="vwl-screen"></div></div>
    <div class="dims" id="dims">No image yet — showing a neutral background.</div>
  </div>
</div>

<script src="assets/overlay.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}
// ---- Endpoints ----
const DRL_API = "https://n8n-admin.willclower.com/webhook/drl";   // write: DRL_API + "/screen"
const DRAFT_URL = DRL_API + "/draft";                             // AI draft-on-upload
const VOCAB_URL = DRL_API + "/vocab";                              // optional; falls back to built-in list

// ---- Asset type + uploaded asset bytes (base64) ----
let assetType = "screen";               // screen | flyer | newsletter
let assetB64 = null, assetMime = null, assetName = null;
let docThumbB64 = null;   // page-1 JPEG thumbnail for flyer/newsletter (B2, browser-rendered)

// ---- Tag vocabulary (fallback if /vocab endpoint not built) ----
const FALLBACK_VOCAB = {
  subject:["stress","sleep","heat","mental-health","movement","nutrition","hydration","prevention","burnout","heart-health","connection"],
  month:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],
  setting:["floor","breakroom","office","any"],
  tone:["calm","action"],
  aspect:["16:9","9:16"]
};
const sel = { subject:new Set(), month:new Set(), setting:new Set(), tone:new Set(), aspect:new Set(["16:9"]) };
let imageDataUrl = null, imageDims = null;
let VOCAB = Object.assign({}, FALLBACK_VOCAB);   // live vocab (fallback until /vocab loads)
function currentVocab(){ return VOCAB; }

function buildPills(vocab){
  for(const g of ["subject","month","setting","tone","aspect"]){
    const host = document.getElementById("t-"+g);
    host.innerHTML = (vocab[g]||[]).map(v=>
      `<span class="pill" data-g="${g}" data-v="${v}" data-on="${sel[g].has(v)?1:0}" onclick="togPill(this)">${v}</span>`
    ).join("");
  }
}
function togPill(el){
  const g=el.dataset.g, v=el.dataset.v, on=el.dataset.on==="1";
  el.dataset.on = on?"0":"1"; on ? sel[g].delete(v) : sel[g].add(v);
  draw();
}

function slugify(s){
  return s.toLowerCase().replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-").replace(/-+/g,"-").slice(0,40);
}
function onTitle(){
  const t=document.getElementById("title").value;
  const idEl=document.getElementById("id"), qrEl=document.getElementById("qr_url");
  if(!idEl.dataset.touched){ idEl.value = slugify(t); }
  if(!qrEl.dataset.touched){ qrEl.value = idEl.value ? "https://go.mymedwellness.com/s/"+idEl.value : ""; }
  draw();
}
document.getElementById("id").addEventListener("input",e=>{ e.target.dataset.touched="1"; const q=document.getElementById("qr_url"); if(!q.dataset.touched) q.value="https://go.mymedwellness.com/s/"+e.target.value; });
document.getElementById("qr_url").addEventListener("input",e=>{ e.target.dataset.touched="1"; });

function currentScreen(){
  const bg = imageDataUrl ? imageDataUrl : "gradient:night";
  return {
    title:document.getElementById("title").value,
    subtitle:document.getElementById("subtitle").value,
    eyebrow:document.getElementById("eyebrow").value,
    cta:document.getElementById("cta").value,
    treatment:document.getElementById("treatment").value,
    accent:document.getElementById("accent").value,
    format:document.getElementById("format").value,
    background:bg
  };
}
function draw(){
  document.getElementById("accentHint").innerHTML =
    `<span class="swatch" style="background:${document.getElementById("accent").value||"#000"}"></span>`;
  renderScreen(document.getElementById("preview"), currentScreen(), { scale:0.5, chrome:true });
}

// ===== Asset type switch =====
function setAssetType(t){
  assetType = t;
  document.querySelectorAll("#assetTypePills .pill").forEach(p=>p.dataset.on = (p.dataset.t===t)?"1":"0");
  const isScreen = t==="screen";
  document.querySelectorAll(".screen-only").forEach(el=>el.style.display = isScreen?"":"none");
  document.querySelectorAll(".doc-only").forEach(el=>el.style.display = isScreen?"none":"");
  // relabel headline/id + accept filter + preview visibility
  document.getElementById("uploadHint").textContent = isScreen ? "16:9 image (PNG/JPEG)" : "PDF document";
  document.getElementById("assetFile").setAttribute("accept", isScreen ? "image/png,image/jpeg" : "application/pdf");
  document.getElementById("idLabel").innerHTML = isScreen
    ? 'Screen ID <span class="hint">auto from headline; edit if needed</span>'
    : 'Resource ID <span class="hint">auto from title; edit if needed</span>';
  document.getElementById("titleLabel").innerHTML = isScreen
    ? 'Headline <span class="hint">the big line</span>'
    : 'Title <span class="hint">the document title</span>';
  document.querySelector(".previewwrap").style.display = isScreen ? "" : "none";
  // clear the loaded asset when switching type (mime/format differ)
  clearAsset();
  buildPills(currentVocab());
}

function clearAsset(){
  assetB64=null; assetMime=null; assetName=null; imageDataUrl=null; imageDims=null; docThumbB64=null;
  const d=document.getElementById("assetDrop");
  d.classList.remove("hasfile"); d.textContent="Click to choose a file, or drag one here";
  document.getElementById("draftBtn").disabled=true;
  document.getElementById("dims").textContent="No image yet — showing a neutral background.";
}

// ===== Upload (asset = the thing being catalogued) =====
function onAsset(ev){
  const f=ev.target.files[0]; if(!f) return;
  assetName=f.name; assetMime=f.type || (assetType==="screen"?"image/png":"application/pdf");
  const reader=new FileReader();
  reader.onload=()=>{
    const dataUrl=reader.result;
    assetB64 = dataUrl.split(",")[1];               // strip data: prefix for the API
    document.getElementById("assetDrop").classList.add("hasfile");
    document.getElementById("assetDrop").textContent = f.name + " ✓  (click to replace)";
    document.getElementById("draftBtn").disabled=false;
    if(assetType==="screen"){
      imageDataUrl=dataUrl;                          // feeds the live overlay preview
      const img=new Image();
      img.onload=()=>{
        imageDims={w:img.naturalWidth,h:img.naturalHeight};
        const under=img.naturalHeight<1080;
        document.getElementById("dims").innerHTML =
          `Image: ${img.naturalWidth}×${img.naturalHeight}` +
          (under ? ` <span class="warn">— below 1080p; fine for demo, upscale for production TV.</span>` : ` — good for TV.`);
        draw();
      };
      img.src=dataUrl;
    } else {
      // Doc (flyer/newsletter): render page 1 to a small JPEG for the library thumbnail.
      docThumbB64 = null;
      makeDocThumb(dataUrl).then(b64 => { docThumbB64 = b64; })
        .catch(() => { docThumbB64 = null; /* falls back to PDF placeholder */ });
    }
  };
  reader.readAsDataURL(f);
}

// Render page 1 of a PDF data URL to a JPEG (max 640px wide), return bare base64.
async function makeDocThumb(pdfDataUrl){
  if(!window.pdfjsLib) return null;
  const b64 = pdfDataUrl.split(",")[1];
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
  const page = await pdf.getPage(1);
  const vp0 = page.getViewport({ scale: 1 });
  const scale = Math.min(640 / vp0.width, 2);
  const vp = page.getViewport({ scale });
  const canvas = document.createElement("canvas");
  canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return canvas.toDataURL("image/jpeg", 0.8).split(",")[1];
}
const assetDrop=document.getElementById("assetDrop");
["dragover","dragenter"].forEach(e=>assetDrop.addEventListener(e,ev=>{ev.preventDefault();assetDrop.classList.add("hasfile");}));
assetDrop.addEventListener("drop",ev=>{ ev.preventDefault(); const f=ev.dataTransfer.files[0]; if(f){ document.getElementById("assetFile").files=ev.dataTransfer.files; onAsset({target:{files:[f]}}); }});

// ===== AI draft =====
function setDraftMsg(text,cls){ const m=document.getElementById("draftMsg"); m.textContent=text; m.className="msg "+(cls||""); }

async function runDraft(){
  if(!assetB64){ setDraftMsg("Upload a file first.","err"); return; }
  const btn=document.getElementById("draftBtn"); btn.disabled=true; setDraftMsg("Drafting…","");
  try{
    const res=await fetch(DRAFT_URL,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ asset_type:assetType, mime:assetMime, file_base64:assetB64 })
    });
    if(!res.ok) throw new Error("draft "+res.status);
    const d=await res.json();
    applyDraft(d);
    setDraftMsg("Drafted — review and edit below.","ok");
  }catch(e){
    setDraftMsg("Draft failed — check the draft workflow / CORS.","err");
  }finally{ btn.disabled=false; }
}

function applyDraft(d){
  const set=(id,v)=>{ const el=document.getElementById(id); if(el) el.value=v||""; };
  set("title", d.title);
  set("subtitle", d.subtitle);
  set("eyebrow", d.eyebrow);
  set("cta", d.cta);
  set("description", d.description);
  set("issue_date", d.issue_date);
  // id/qr auto-fill from title unless the user already touched them
  onTitle();
  // tags: replace selections with validated draft tags
  const tags=d.tags||{};
  for(const g of Object.keys(sel)){
    sel[g].clear();
    (Array.isArray(tags[g])?tags[g]:[]).forEach(v=>sel[g].add(v));
  }
  if(assetType==="screen" && sel.aspect.size===0) sel.aspect.add("16:9");
  buildPills(currentVocab());
  draw();
}

function setMsg(text,cls){ const m=document.getElementById("msg"); m.textContent=text; m.className="msg "+(cls||""); }

async function save(){
  const id=document.getElementById("id").value.trim();
  const title=document.getElementById("title").value.trim();
  if(!id){ setMsg("Need a screen ID.","err"); return; }
  if(!title){ setMsg("Need a headline.","err"); return; }

  const payload = {
    id, title, asset_type: assetType,
    subtitle:document.getElementById("subtitle").value.trim(),
    eyebrow:document.getElementById("eyebrow").value.trim(),
    cta:document.getElementById("cta").value.trim(),
    treatment:document.getElementById("treatment").value,
    accent:document.getElementById("accent").value.trim(),
    format:document.getElementById("format").value,
    qr_url:document.getElementById("qr_url").value.trim(),
    description:document.getElementById("description").value.trim(),
    issue_date:document.getElementById("issue_date").value.trim() || null,
    subject:[...sel.subject], month:[...sel.month], setting:[...sel.setting],
    tone:[...sel.tone], aspect:[...sel.aspect],
    // screens send the background image; docs send the PDF bytes. Both ride image_base64.
    image: imageDataUrl || null,
    file_base64: assetB64 || null,
    thumb_base64: docThumbB64 || null,
    mime: assetMime || null
  };

  const btn=document.getElementById("save"); btn.disabled=true; setMsg("Publishing…","");

  // If a doc was uploaded but its thumbnail is still rendering, wait briefly.
  if(assetType!=="screen" && assetB64 && !docThumbB64){
    for(let i=0;i<20 && !docThumbB64;i++){ await new Promise(r=>setTimeout(r,150)); }
    // if it never rendered, publish anyway — card falls back to the PDF placeholder
    payload.thumb_base64 = docThumbB64 || null;
  }

  try{
    const res=await fetch(DRL_API+"/screen",{
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)
    });
    const out=await res.json();
    if(out.ok){
      setMsg(`Saved “${out.saved}”${out.width?` (${out.width}×${out.height})`:""}. It's in the library now.`,"ok");
    }else{
      setMsg("Server responded but not OK — check the workflow.","err");
    }
  }catch(e){
    setMsg("Could not reach the write API. Check the endpoint/CORS.","err");
  }finally{ btn.disabled=false; }
}

function resetForm(){
  ["title","subtitle","eyebrow","cta","qr_url","id","description","issue_date"].forEach(k=>{const el=document.getElementById(k);if(el){el.value="";el.dataset.touched="";}});
  document.getElementById("accent").value="#d9b98f";
  document.getElementById("treatment").value="left-scrim";
  document.getElementById("format").value="still";
  clearAsset();
  for(const g in sel){ sel[g].clear(); } sel.aspect.add("16:9");
  buildPills(currentVocab()); draw(); setMsg("","");
  setDraftMsg("","");
}

async function loadVocab(){
  try{
    const res=await fetch(VOCAB_URL); if(!res.ok) throw 0;
    const v=await res.json();
    VOCAB=Object.assign({}, FALLBACK_VOCAB, v);
    buildPills(VOCAB);
  }catch(e){ VOCAB=Object.assign({}, FALLBACK_VOCAB); buildPills(VOCAB); }
}

// init
buildPills(FALLBACK_VOCAB);
loadVocab();
setAssetType("screen");
draw();
</script>
</body>
</html>
